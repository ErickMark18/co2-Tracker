[project]
name = "co2-tracker"
version = "1.0.0"
description = "CO2 Tracker - Estimates and visualizes carbon footprint of GitHub Actions deployments"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.124.0",
    "uvicorn>=0.38.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"