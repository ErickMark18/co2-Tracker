<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO2 Tracker Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #09090b;
            --bg-secondary: #18181b;
            --bg-card: #1f1f23;
            --bg-card-hover: #27272c;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            --accent-green: #16a34a;
            --accent-green-bright: #22c55e;
            --accent-yellow: #ca8a04;
            --accent-red: #dc2626;
            --accent-blue: #2563eb;
            --border-color: #27272a;
            --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            opacity: 0;
            transform: translateY(-8px);
            animation: fadeSlideIn 0.5s var(--ease-out-quart) forwards;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-green-bright), var(--accent-green));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
        }

        .logo-icon svg {
            width: 22px;
            height: 22px;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .last-update {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 900px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 540px) {
            .stats-grid { grid-template-columns: 1fr; }
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeSlideIn 0.5s var(--ease-out-quart) forwards;
            transition: background 0.2s var(--ease-out-quart), border-color 0.2s var(--ease-out-quart), box-shadow 0.2s var(--ease-out-quart);
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.15s; }
        .stat-card:nth-child(3) { animation-delay: 0.2s; }
        .stat-card:nth-child(4) { animation-delay: 0.25s; }

        .stat-card:hover {
            background: var(--bg-card-hover);
            border-color: #3f3f46;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .stat-value {
            font-size: 1.875rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .stat-value.green { color: var(--accent-green-bright); }
        .stat-value.yellow { color: var(--accent-yellow); }
        .stat-value.red { color: var(--accent-red); }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 900px) {
            .charts-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            opacity: 0;
            transform: translateY(16px);
            animation: fadeSlideIn 0.6s var(--ease-out-quart) forwards;
        }

        .card:nth-child(1) { animation-delay: 0.3s; }
        .card:nth-child(2) { animation-delay: 0.35s; }
        .card:nth-child(3) { animation-delay: 0.4s; }
        .card:nth-child(4) { animation-delay: 0.45s; }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        .rankings-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.875rem 1rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            transition: background 0.15s var(--ease-out-quart), transform 0.15s var(--ease-out-quart);
            cursor: default;
        }

        .ranking-item:hover {
            background: var(--bg-card-hover);
            transform: translateX(4px);
        }

        .ranking-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
        }

        .ranking-position {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            width: 24px;
            flex-shrink: 0;
        }

        .ranking-name {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ranking-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .region-card {
            background: linear-gradient(145deg, rgba(22, 163, 74, 0.08) 0%, var(--bg-card) 100%);
            border-color: rgba(22, 197, 94, 0.2);
        }

        .region-card .card-title {
            color: var(--accent-green-bright);
        }

        .alternative-region {
            text-align: center;
            padding: 0.5rem 0;
        }

        .alt-region-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-green-bright);
            margin-bottom: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .alt-saving {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            line-height: 1;
        }

        .alt-saving-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        .alt-comparison {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
            gap: 0.5rem;
        }

        .alt-comparison span {
            font-family: 'JetBrains Mono', monospace;
        }

        .alt-comparison strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .loading-skeleton {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }

        .skeleton-stat {
            height: 72px;
        }

        .skeleton-chart {
            height: 280px;
        }

        .skeleton-rankings {
            height: 200px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 56px;
            height: 56px;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 0.9rem;
            max-width: 280px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            opacity: 0;
            animation: fadeSlideIn 0.5s var(--ease-out-quart) 0.5s forwards;
        }

        @keyframes fadeSlideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m-11.32-11.32l1.41-1.41"/>
                    </svg>
                </div>
                <h1>CO2 Tracker</h1>
            </div>
            <div class="last-update" id="lastUpdate"></div>
        </header>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Deploys</div>
                <div class="stat-value" id="totalDeploys">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total CO2</div>
                <div class="stat-value green" id="totalCo2">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Average CO2</div>
                <div class="stat-value" id="avgCo2">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Best Region</div>
                <div class="stat-value green" id="bestRegion">--</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Emissions Over Time</span>
                </div>
                <div class="chart-container">
                    <canvas id="emissionsChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Top Repos by CO2</span>
                </div>
                <div class="rankings-list" id="repoRankings">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M3 3v18h18"/>
                            <path d="M7 16l4-4 4 4 5-6"/>
                        </svg>
                        <p>No deployment data yet</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Emissions by Region</span>
                </div>
                <div class="chart-container">
                    <canvas id="regionChart"></canvas>
                </div>
            </div>

            <div class="card region-card">
                <div class="card-header">
                    <span class="card-title">Alternative Region</span>
                </div>
                <div class="alternative-region">
                    <div class="alt-region-name" id="altRegionName">--</div>
                    <div class="alt-saving" id="altSaving">--</div>
                    <div class="alt-saving-label">potential saving</div>
                    <div class="alt-comparison" id="altComparison">
                        <span>Current: <strong id="currentRegion">--</strong></span>
                        <span>Alternative: <strong id="altRegion">--</strong></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            CO2 Tracker &middot; Tracking carbon footprint of deployments
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const RECHARGE_INTERVAL = 30000;

        async function fetchJSON(url, options = {}) {
            try {
                const res = await fetch(url, options);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (e) {
                console.warn('Fetch failed:', e.message);
                return null;
            }
        }

        function formatNumber(num, decimals = 1) {
            if (num === null || num === undefined || isNaN(num)) return '--';
            return num.toFixed(decimals);
        }

        function formatCO2(grams) {
            if (grams < 1) return `${(grams * 1000).toFixed(0)} mg`;
            if (grams < 1000) return `${formatNumber(grams)} g`;
            return `${formatNumber(grams / 1000, 2)} kg`;
        }

        function getChartColors() {
            return {
                green: '#22c55e',
                greenAlpha: 'rgba(34, 197, 94, 0.12)',
                grid: '#27272a',
                textMuted: '#71717a',
                textSecondary: '#a1a1aa',
            };
        }

        function animateChartIn(canvasEl) {
            const ctx = canvasEl.getContext('2d');
            const originalDraw = ctx.draw;
            ctx.draw = function(...args) {
                this.save();
                this.globalAlpha = 0;
                originalDraw.apply(this, args);
                const fadeIn = () => {
                    if (this.globalAlpha < 1) {
                        this.globalAlpha = Math.min(1, this.globalAlpha + 0.05);
                        originalDraw.apply(this, args);
                        requestAnimationFrame(fadeIn);
                    }
                };
                fadeIn();
                ctx.draw = originalDraw;
            };
        }

        async function loadStats() {
            const stats = await fetchJSON(`${API_BASE}/stats`);
            return stats;
        }

        async function loadDeploys(limit = 100) {
            const deploys = await fetchJSON(`${API_BASE}/deploys?limit=${limit}`);
            return deploys?.deploys ?? [];
        }

        function renderStats(stats) {
            document.getElementById('totalDeploys').textContent = stats.total_deploys;
            document.getElementById('totalCo2').textContent = formatCO2(stats.total_co2_g);
            document.getElementById('avgCo2').textContent = formatCO2(stats.avg_co2_g);

            const bestRegion = Object.entries(stats.by_region || {})
                .sort(([,a], [,b]) => (a.total_co2_g / a.count) - (b.total_co2_g / b.count))[0];
            document.getElementById('bestRegion').textContent = bestRegion ? bestRegion[0] : '--';
        }

        function renderRepoRankings(byRepo) {
            const container = document.getElementById('repoRankings');
            const sorted = Object.entries(byRepo)
                .sort(([,a], [,b]) => b.total_co2_g - a.total_co2_g)
                .slice(0, 5);

            if (sorted.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M3 3v18h18"/>
                            <path d="M7 16l4-4 4 4 5-6"/>
                        </svg>
                        <p>No deployment data yet</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = sorted.map(([repo, data], i) => `
                <div class="ranking-item">
                    <div class="ranking-info">
                        <span class="ranking-position">${i + 1}</span>
                        <span class="ranking-name">${repo}</span>
                    </div>
                    <span class="ranking-value">${formatCO2(data.total_co2_g)}</span>
                </div>
            `).join('');
        }

        function renderEmissionsChart(deploys) {
            const dailyData = {};
            deploys.forEach(d => {
                const day = new Date(d.timestamp).toISOString().slice(0, 10);
                dailyData[day] = (dailyData[day] || 0) + d.co2_grams;
            });
            const days = Object.keys(dailyData).sort();
            const dailyValues = days.map(d => dailyData[d]);

            const colors = getChartColors();

            new Chart(document.getElementById('emissionsChart'), {
                type: 'line',
                data: {
                    labels: days,
                    datasets: [{
                        label: 'CO2',
                        data: dailyValues,
                        borderColor: colors.green,
                        backgroundColor: colors.greenAlpha,
                        fill: true,
                        tension: 0.35,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        pointBackgroundColor: colors.green,
                        pointBorderColor: '#09090b',
                        pointBorderWidth: 2,
                        borderWidth: 2.5,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#18181b',
                            titleColor: colors.textSecondary,
                            bodyColor: colors.textPrimary,
                            borderColor: colors.grid,
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: ctx => `${formatCO2(ctx.parsed.y)} CO2`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: colors.grid, drawBorder: false },
                            ticks: { color: colors.textMuted, font: { size: 11 } }
                        },
                        y: {
                            grid: { color: colors.grid, drawBorder: false },
                            ticks: { color: colors.textMuted, font: { size: 11 } },
                        }
                    }
                }
            });
        }

        function renderRegionChart(byRegion) {
            const colors = getChartColors();
            const regionLabels = Object.keys(byRegion);
            const regionValues = regionLabels.map(r => byRegion[r].total_co2_g);

            const hueBase = 142;
            const backgroundColors = regionLabels.map((_, i) => {
                const hue = (hueBase + i * 28) % 360;
                return `hsla(${hue}, 65%, 50%, 0.85)`;
            });

            new Chart(document.getElementById('regionChart'), {
                type: 'bar',
                data: {
                    labels: regionLabels,
                    datasets: [{
                        label: 'CO2',
                        data: regionValues,
                        backgroundColor: backgroundColors,
                        borderRadius: 6,
                        borderSkipped: false,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#18181b',
                            titleColor: colors.textSecondary,
                            bodyColor: colors.textPrimary,
                            borderColor: colors.grid,
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: ctx => `${formatCO2(ctx.parsed.y)} CO2`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: colors.textMuted, font: { size: 11 } }
                        },
                        y: {
                            grid: { color: colors.grid, drawBorder: false },
                            ticks: { color: colors.textMuted, font: { size: 11 } },
                        }
                    }
                }
            });
        }

        async function loadAlternativeRegion(byRegion) {
            if (!byRegion || Object.keys(byRegion).length === 0) return null;

            const worstRegion = Object.entries(byRegion)
                .sort(([,a], [,b]) => (b.total_co2_g / b.count) - (a.total_co2_g / a.count))[0];

            if (!worstRegion) return null;

            const region = worstRegion[0];
            const data = await fetchJSON(`${API_BASE}/region/alternative?region=${encodeURIComponent(region)}&provider=aws`);
            return data;
        }

        async function loadDashboard() {
            const stats = await loadStats();
            const deploys = await loadDeploys();

            if (!stats || !deploys || stats.total_deploys === 0) {
                document.body.innerHTML = `
                    <div class="container">
                        <header style="opacity:1;transform:none;">
                            <div class="logo">
                                <div class="logo-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
                                        <circle cx="12" cy="12" r="5"/>
                                        <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m-11.32-11.32l1.41-1.41"/>
                                    </svg>
                                </div>
                                <h1>CO2 Tracker</h1>
                            </div>
                        </header>
                        <div class="empty-state" style="opacity:1;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 6v6l4 2"/>
                            </svg>
                            <p>No deployment data yet. Make a deployment to start tracking your carbon footprint.</p>
                        </div>
                    </div>
                `;
                return;
            }

            renderStats(stats);
            renderRepoRankings(stats.by_repo || {});
            renderEmissionsChart(deploys);
            renderRegionChart(stats.by_region || {});

            const altRegion = await loadAlternativeRegion(stats.by_region);
            if (altRegion && altRegion.alternative_region) {
                document.getElementById('altRegionName').textContent = altRegion.alternative_region;
                document.getElementById('altSaving').textContent = `${altRegion.potential_saving_percent}%`;
                document.getElementById('currentRegion').textContent = `${altRegion.current_region} (${altRegion.current_intensity})`;
                document.getElementById('currentIntensity').textContent = `${altRegion.alternative_region} (${altRegion.alternative_intensity})`;
            }

            document.getElementById('lastUpdate').textContent = `Updated ${new Date().toLocaleTimeString()}`;
        }

        document.addEventListener('DOMContentLoaded', loadDashboard);
        setInterval(loadDashboard, RECHARGE_INTERVAL);
    </script>
</body>
</html>
